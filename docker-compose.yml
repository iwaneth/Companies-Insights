services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    dns:
      - 8.8.8.8
      - 1.1.1.1
    container_name: n8n_local
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - ./n8n_data:/home/node/.n8n:Z
      # Note: The volume is mounted with the 'Z' option to ensure proper SELinux context on systems that enforce it.
      # Note: This volume is mounted to save n8n data in a custom folder instead of default docker container location. This allows for easier backup and management of n8n data.
    environment:
      - N8N_SECURE_COOKIE=false
      - NODE_FUNCTION_ALLOW_EXTERNAL=axios,lodash
      - N8N_LOG_LEVEL=debug
      - EXECUTIONS_DATA_PURGE=true
      - EXECUTIONS_DATA_MAX_AGE=72
      # Note: the following environment variables are set exactly to match the device potentials.
      # They can be changed to match your own environment and requirements.
  app:
    profiles: ["dev"] # This service is disabled temporarily for development purposes. You can enable it by removing the 'profiles' line.
    build: .
    container_name: backend_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app:z # Note: The volume is mounted with the 'z' option to ensure proper SELinux context on systems that enforce it.
